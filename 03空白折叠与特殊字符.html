<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>空白实验场</title>
</head>
<body>
    <h1>空白实验场</h1>
    
    <h2>1. 空白折叠</h2>
    <!-- 这是 HTML 注释，浏览器会忽视，只写给人看，快捷键：Ctrl+/ -->
    <p>这后面有     很多空格，
        源码里还换了好几行——
        但显示出来只剩 1 个空格。
    </p>

    <h2>2. br：强制断行</h2>
    <p>
        床前明月光，<br>
        疑是地上霜。<br>
        举头望明月，<br>
        低头思故乡。
    </p>

    <h2>3. nbsp：不折叠的空格</h2>
    <p>旧金山&nbsp;&nbsp;&nbsp;&nbsp;北京</p>
    <p>旧金山    北京</p>

    <h2>4. 实体：显示特殊字符本身</h2>
    <p>尖括号本身：&lt;h1&gt;</p>
    <p>和号本身：AT&amp;T</p>

    <p>
        东边日出西边雨，<br>道是无晴却有晴。
    </p>

    <p>&lt;!DOCTYPE html&gt;</p>
</body>
</html>
