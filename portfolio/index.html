<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whyao · 作品集</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="topbar" id="topbar">
        <a href="#top">Whyao</a>
        <nav>
            <a href="#top">首页</a>
            <a href="#works">作品</a>
            <a href="#about">关于</a>
        </nav>
    </header>

    <main>
        <section id="works">
            <h2>作品</h2>
            <div class="grid" id="works-grid"></div>
        </section>
        <section id="about">
            <h2>关于</h2>
            <div class="about-content">
                <img class="avatar" src="images/bee.png" alt="头像">
                <div class="about-text">
                    <p>Whyao · 个人项目：“从 Python 后端起步，现在正全力补全前端地基。这个站点收录了我独立开发的项目：从网络舆情引擎、聊天助手到语言学习工具。”</p>
                </div>
            </div>
        </section>
    </main>


    <!-- 模态框 -->
     <div class="modal" id="my-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-content">
            <button class="modal-close" id="modal-close">×</button>
            <img class="modal-img" id="modal-img" src="" alt="">
            <h2 id="modal-title"></h2>
            <p id="modal-detail"></p>
            <a id="modal-link" href="" target="_blank" rel="noopener">访问作品 →</a>
        </div>
     </div>


    <footer>
        <p>&copy; 2026 · Whyao</p>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
