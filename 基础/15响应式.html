<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 手机适配的第一块拼图：让手机按“真实宽度”渲染 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 注释掉viewport后，移动端显示的是“缩小版桌面网页” -->
    <title>媒体查询与响应式</title>
    <style>
        body {
            /* 清掉浏览器默认的 8px 外边距，顶栏才能通栏 */
            margin: 0;
            font-family: "微软雅黑", "Microsoft YaHei", sans-serif;
            line-height: 1.6;
            color: #333333;
        }

        /* 内容容器：最多 960px、居中；窗口更窄时自动变窄 */
        .wrap {
            max-width: 960px;
            margin: 0 auto;
            padding: 0 16px;
        }

        /* 顶栏：站名靠左、导航靠右 */
        .topbar {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 12px 16px;
            background-color: #1e5a96;
            color: #ffffff;
        }
        .topbar nav {
            display: flex;
            gap: 16px;
        }
        .topbar nav a {
            color: #ffffff;
            text-decoration: none;
        }

        /* 卡片区：大屏一排三张 */
        .cards {
            display: flex;
            gap: 16px;
            margin-top: 16px;
        }
        .card {
            flex: 1;
            padding: 16px;
            border: 1px solid #cccccc;
            border-radius: 8px;
            background-color: #f8fafc;
        }

        /* 图片：别撑破屏幕 */
        img {
            max-width: 100%;
            height: auto;
        }

        /* 状态牌：默认显示“电脑模式”，藏起“手机模式” */
        .mode {
            padding: 2px 12px;
            border-radius: 999px;
            font-size: 14px;
        }
        .mobile-mode {
            position: relative;
            display: none;
            background-color: #fdf3e7;
            color: #b35c00;
        }
        .desktop-mode {
            background-color: #eef4fb;
            color: #1e5a96;
        }

        .badge {
                position: absolute;
                top: -10px;
                right: -10px;
                padding: 2px 10px;
                background-color: orangered;
                color: #ffffff;
                border-radius: 999px;
                font-size: 14px;
            }

        /* 媒体查询：窗口宽度 小于 768px 时，以下规则覆盖上面的 */
        @media (max-width: 768px) {
            .mobile-mode {
                display: inline-block;
            }
            .desktop-mode {
                display: none;
            }

            .cards {
                /* 一排 -> 一列 */
                flex-direction: column;
            }

            .topbar {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <span>花易落</span>
        <nav>
            <a href="#">首页</a>
            <a href="#">课程</a>
            <a href="#">关于</a>
        </nav>
    </header>

    <div class="wrap">
        <h1>媒体查询与响应式</h1>

        <p>
            <span class="mobile-mode mode">
                现在是手机模式（窗口 小于等于 768px）
                <span class="badge">!</span>
            </span>
            <span class="desktop-mode mode">
                现在是电脑模式（窗口 宽于 768px）
            </span>
        </p>

        <img src="flower.png" alt="一朵花">

        <div class="cards">
            <div class="card">卡片一：窗口宽时，我们三并排。</div>
            <div class="card">卡片二：窗口窄时，我们上下叠。</div>
            <div class="card">卡片三：慢慢拖窗口宽度，盯住 768px 那一刻。</div>
        </div>

    </div>
</body>
</html>
