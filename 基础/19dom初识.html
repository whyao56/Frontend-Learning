<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>19 DOM 初识</title>
    <style>
        body {
            font-family: "微软雅黑", "Microsoft YaHei", sans-serif;
            line-height: 1.6;
            color: #333333;
        }
        .highlight {
            background-color: #fff3cd;
            outline: 1px solid  #e0a800;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <h1 id="title">DOM 初识</h1>
    <p class="intro">这是一段介绍文字。</p>
    <ul id="list">
        <li class="item">第一项</li>
        <li class="item">第二项</li>
        <li class="item">第三项</li>
    </ul>
    <p id="output">这里稍后会被 JS 写入内容。</p>

    <script>
        // 选中：参数就是 CSS 选择器，返回第一个匹配的元素
        const title = document.querySelector("#title");
        const intro = document.querySelector(".intro");
        const items = document.querySelectorAll(".item");  // 返回所有匹配的元素，返回的是一个 NodeList

        // 读取内容
        console.log(title.textContent);  // DOM 元素的文本内容
        console.log(items.length);  // 3：NodeList 的长度

        // 改文字
        title.textContent = "DOM，我抓住你了！";  // 改变标题的文本内容

        // 改样式（CSS 属性名要转换为驼峰命名 camelCase：font - size fontSize）
        intro.style.color = "#c0392b";  // 改变文字颜色
        intro.style.fontSize = "20px";  // 改变文字大小

        // 改类名
        items[1].classList.add("highlight");  // 给第二项添加 highlight 类
        // items[1].classList.remove("highlight");  // 删除第二项的 highlight 类
        items[2].classList.toggle("highlight");  // 切换第三项的 highlight 类（如果有就删除，没有就添加）

        // 批量操作：每个列表前面加 ★，并把统计写进页面
        for (const item of items) {
            item.textContent = "★ " + item.textContent; 
        }
        // document.querySelector("#output").textContent = `列表中共有 ${items.length} 项。`;
        document.querySelector("#output").textContent = `我一共抓到了 ${items.length} 个列表项！`;

        document.title = "DOM 初识 - 已修改";  // 改网页标题


        const firstItem = document.querySelector(".item");

        const listItems = document.querySelectorAll("#list li");

        const titleEL = document.querySelector("#title");

        console.log(firstItem.textContent);  // 输出第一个列表项的文本内容
        console.log(listItems.length);  // 输出列表项的数量
        console.log(titleEL.textContent);  // 输出标题的文本内容
    </script>
</body>
</html>
